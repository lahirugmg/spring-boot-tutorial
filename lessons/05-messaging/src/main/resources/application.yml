server:
  port: 8085

spring:
  application:
    name: messaging

  kafka:
    bootstrap-servers: localhost:59092    # shifted host port, see docker-compose.yml

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      # -----------------------------------------------------------------------------
      # DURABILITY. The three settings interviewers ask about together.
      #
      # acks=all      the leader waits for every in-sync replica before acknowledging.
      #               acks=1 acknowledges after the LEADER writes — if it dies before the
      #               followers catch up, the message is gone. acks=0 does not wait at all.
      #               Use `all` unless you can articulate why losing data is acceptable.
      #
      # min.insync.replicas (a BROKER/topic setting, not here) is the other half: acks=all
      #               with only 1 in-sync replica is no safer than acks=1. The standard
      #               production pairing is replication.factor=3 + min.insync.replicas=2.
      #
      # enable.idempotence=true  de-duplicates producer RETRIES. Without it, a retry after a
      #               lost ack writes the record TWICE. It requires acks=all,
      #               retries>0 and max.in.flight<=5 — Kafka sets those implicitly.
      #               Default since Kafka 3.0.
      # -----------------------------------------------------------------------------
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        # >1 in-flight requests can REORDER on retry unless idempotence is on (it is).
        max.in.flight.requests.per.connection: 5
        # Wait up to 10ms to fill a batch. Slightly higher latency, far better throughput.
        linger.ms: 10
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
      batch-size: 16384
      compression-type: snappy

      # NOTE: no transaction-id-prefix here. Setting one on the DEFAULT producer factory
      # would make every kafkaTemplate.send() require a transaction — a plain send() outside
      # one throws "No transaction is in process". A separate transactional producer factory
      # + KafkaTemplate lives in KafkaProducerConfig, used only by
      # OrderEventProducer#sendTransactionally. Keep the common fire-and-forget path cheap;
      # pay the transactional cost only where atomicity is actually needed.

    consumer:
      group-id: order-processor
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer WRAPS the real deserializer. Without it, a malformed
      # record throws inside the poll loop, the container cannot advance past it, and the
      # consumer spins forever on the same offset — a genuine production outage. With it,
      # the failure is turned into a DeserializationException the error handler can route
      # to the DLT.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      # auto-offset-reset applies ONLY when the group has no committed offset:
      #   earliest - replay the whole topic (what you usually want for a new service)
      #   latest   - start from now, silently skipping everything already there
      #   none     - throw
      auto-offset-reset: earliest

      # Offsets are committed by the CONTAINER after the listener returns, not by a
      # background timer. That is what makes the default at-least-once rather than
      # at-most-once. Never set enable.auto.commit=true with a manual listener.
      enable-auto-commit: false

      max-poll-records: 100
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.learning.messaging.domain"
        # Unknown fields must NOT break older consumers — this is the single most important
        # setting for schema evolution.
        spring.json.value.default.type: com.learning.messaging.domain.OrderEvent
        # If a consumer takes longer than this between polls, the broker assumes it died and
        # REBALANCES — the partition is reassigned and the record redelivered. Slow
        # processing plus a large max-poll-records is the classic cause of a rebalance storm.
        max.poll.interval.ms: 300000
        session.timeout.ms: 45000
        heartbeat.interval.ms: 3000
        # Only read records from COMMITTED transactions.
        isolation.level: read_committed

    listener:
      # RECORD: commit after each record. BATCH: commit after the whole poll batch.
      # MANUAL/MANUAL_IMMEDIATE: you call Acknowledgment.acknowledge() yourself.
      ack-mode: RECORD
      missing-topics-fatal: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    "[com.learning.messaging]": DEBUG
    "[org.apache.kafka]": WARN         # the client is extremely chatty at INFO
    # Uncomment to watch partition assignment and rebalances.
    # "[org.springframework.kafka.listener]": DEBUG
