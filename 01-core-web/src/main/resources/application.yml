server:
  port: 8081

spring:
  application:
    name: core-web
  # INTERVIEW: property precedence, highest wins:
  #   1. devtools global settings          5. OS environment variables
  #   2. @TestPropertySource / test props  6. application-{profile}.yml
  #   3. command line args (--foo=bar)     7. application.yml
  #   4. SPRING_APPLICATION_JSON           8. @PropertySource
  #   ...  defaults in code are last
  # Try it:  ./mvnw -pl 01-core-web spring-boot:run -Dspring-boot.run.arguments=--app.max-tasks=3
  profiles:
    default: dev

  mvc:
    problemdetails:
      # Would make Spring's own exceptions (404, 405, 415...) return RFC 7807 bodies by
      # registering ProblemDetailsExceptionHandler. Left OFF here because
      # GlobalExceptionHandler extends ResponseEntityExceptionHandler, which already does
      # it — and Boot's @ConditionalOnMissingBean(ResponseEntityExceptionHandler.class)
      # backs off the moment our bean exists. Flip it on and nothing changes; that is the
      # point of the back-off mechanism.
      enabled: false

# Bound to AppProperties. Anything invalid here fails the app at STARTUP thanks to @Validated.
app:
  greeting-style: english
  max-tasks: 100
  cleanup-interval: 30s
  feature:
    pirate-mode-enabled: false
    request-timing-enabled: true

management:
  endpoints:
    web:
      exposure:
        # NEVER do this in production — expose only health/info/prometheus and put the rest
        # on a separate, firewalled management port (management.server.port).
        include: health,info,metrics,beans,env,configprops,mappings,loggers,conditions,threaddump
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Core & Web fundamentals
    module: "01"

logging:
  pattern:
    # %X{requestId} pulls the value RequestIdFilter put into the MDC.
    level: "%5p [${spring.application.name},%X{requestId:-no-request}]"
  level:
    # Brackets escape the dots so the key is treated as one map entry, not a nested tree.
    "[com.learning.coreweb]": DEBUG
